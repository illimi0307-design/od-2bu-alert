name: check-2bu

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 몇 분씩 늦을 수 있음)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: check-2bu
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 2부 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -X utf8 watch_2bu.py --once
      # 60일 동안 저장소에 변화가 없으면 GitHub이 자동 실행을 멈추므로, 하루 한 번 날짜를 기록
      - name: keep alive
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "$(cat last_run.txt 2>/dev/null)" != "$today" ]; then
            echo "$today" > last_run.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add last_run.txt
            git commit -m "keep alive $today"
            git push
          fi
